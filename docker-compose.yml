services:
  frame-art:
    image: ghcr.io/anairdrop/samsung-frame-tv-art-generator:latest
    network_mode: host
    volumes:
      - ./data:/data
    restart: unless-stopped
    environment:
      FRAME_ART_DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_ARTWORKS_PER_TV: ${MAX_ARTWORKS_PER_TV:-20}
      GENERATION_RATE_LIMIT_PER_HOUR: ${GENERATION_RATE_LIMIT_PER_HOUR:-20}

  cloudflared:
    image: cloudflare/cloudflared:latest
    network_mode: host
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    profiles: ["tunnel"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
