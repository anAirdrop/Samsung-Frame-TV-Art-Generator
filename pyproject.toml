[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "frame-tv-art-generator"
version = "1.0.0"
description = "Voice-controlled AI art generator for Samsung Frame TVs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "openai>=1.40.0",
    "google-genai>=1.0.0",
    "Pillow>=10.0",
    "httpx>=0.27.0",
    "ask-sdk-core>=1.19.0",
    "ask-sdk-webservice-support>=1.3.0",
    "samsungtvws[async]@ git+https://github.com/xchwarze/samsung-tv-ws-api.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]
