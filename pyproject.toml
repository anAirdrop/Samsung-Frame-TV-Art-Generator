[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-tv-art-generator"
version = "0.2.0"
description = "Voice-controlled AI art generator for Samsung Frame TVs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "fal-client>=1.0.0,<2.0.0",
    "Pillow>=10.0,<13.0",
    "httpx>=0.27.0,<1.0.0",
    "ask-sdk-core>=1.19.0,<2.0.0",
    "ask-sdk-webservice-support>=1.3.0,<2.0.0",
    "samsungtvws==3.0.6",
]

[project.scripts]
frame-art = "frame_art.main:main"
frame-art-diagnostics = "frame_art.diagnostics:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frame_art = ["templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
