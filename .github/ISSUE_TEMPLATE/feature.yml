name: Feature request
description: Suggest a focused improvement to Frame Art
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: User problem
      description: Describe the problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Desired experience
      description: What should a new or existing user be able to do?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
